name: Rebuild reviewed LabGuard PDFs

on:
  push:
    branches:
      - chore/final-repo-cleanup
    paths:
      - '.github/workflows/rebuild-reviewed-pdfs.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/final-repo-cleanup

      - name: Install XeLaTeX and compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-pictures fonts-liberation2

      - name: Build affected PDFs only
        shell: bash
        run: |
          set -euo pipefail
          cd docs/pdf/source
          cp labguard_pdf.sty /tmp/labguard_pdf.sty.original
          sed -i 's/Times New Roman/Liberation Serif/g; s/Consolas/Liberation Mono/g' labguard_pdf.sty

          for src in 01_LabGuard_Tong_Quan_A-Z.tex 03_LabGuard_Huong_Dan_Thanh_Vien_B.tex; do
            xelatex -interaction=nonstopmode -halt-on-error "$src" >/dev/null
            xelatex -interaction=nonstopmode -halt-on-error "$src" >/dev/null
          done

          mv 01_LabGuard_Tong_Quan_A-Z.pdf ../LabGuard_Tong_Quan_A-Z.pdf
          mv 03_LabGuard_Huong_Dan_Thanh_Vien_B.pdf ../LabGuard_Huong_Dan_Thanh_Vien_B.pdf

          mv /tmp/labguard_pdf.sty.original labguard_pdf.sty
          rm -f *.aux *.log *.out *.toc *.lof *.lot *.synctex.gz

      - name: Verify page counts and corrected text
        shell: bash
        run: |
          sudo apt-get install -y poppler-utils
          test "$(pdfinfo docs/pdf/LabGuard_Tong_Quan_A-Z.pdf | awk '/^Pages:/ {print $2}')" = "28"
          test "$(pdfinfo docs/pdf/LabGuard_Huong_Dan_Thanh_Vien_B.pdf | awk '/^Pages:/ {print $2}')" = "15"
          pdftotext docs/pdf/LabGuard_Tong_Quan_A-Z.pdf - | grep -q 'COMMAND_RESULT'
          pdftotext docs/pdf/LabGuard_Huong_Dan_Thanh_Vien_B.pdf - | grep -q 'MetricSamples'
          ! pdftotext docs/pdf/LabGuard_Huong_Dan_Thanh_Vien_B.pdf - | grep -q 'RowVersion = @NewVer'

      - name: Commit rebuilt PDFs and remove one-off workflow
        shell: bash
        run: |
          git config user.name "Võ Trọng Phúc"
          git config user.email "98134752+Phuchello@users.noreply.github.com"
          git add docs/pdf/LabGuard_Tong_Quan_A-Z.pdf docs/pdf/LabGuard_Huong_Dan_Thanh_Vien_B.pdf
          git rm .github/workflows/rebuild-reviewed-pdfs.yml
          git commit -m "docs: rebuild reviewed LabGuard handbooks"
          git push origin chore/final-repo-cleanup
